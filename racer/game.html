<title>Rainbow Racers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* One-screen kids arcade: full-bleed canvas, chunky rounded type, candy colors. Single bright look on purpose. */
:root{
  color-scheme:light;
  --ink:#2b2350;
  --paper:#ffffff;
  --pink:#ff4fa0;
  --sun:#ffd23f;
  --sky:#5ec8ff;
  --font:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#86d96b;touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:var(--font);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:var(--ink)}
.hud{position:fixed;z-index:5;display:flex;align-items:center;gap:6px;font-weight:700;
  background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-size:24px;
  box-shadow:0 4px 0 rgba(43,35,80,.18);pointer-events:none}
#stars{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
#place{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
.topright{position:fixed;z-index:6;display:flex;gap:8px;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.round{pointer-events:auto;border:0;cursor:pointer;width:48px;height:48px;justify-content:center;padding:0;font-size:22px;position:static}
.round:focus-visible,.big:focus-visible,.racer:focus-visible,.card:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
.big{position:fixed;z-index:6;border:0;cursor:pointer;border-radius:22px;min-width:64px;height:64px;padding:0 14px;
  font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 5px 0 rgba(43,35,80,.25);background:rgba(255,255,255,.92)}
.big:active,.round:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,35,80,.25)}
#carBtn{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:36px;width:72px;padding:0}
#viewBtn{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:24px}
#tray{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));
  width:min(560px,calc(100% - 24px));background:rgba(255,255,255,.97);border-radius:28px;padding:14px;
  box-shadow:0 10px 0 rgba(43,35,80,.2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#tray .racer{font-size:clamp(34px,10vw,52px);border-radius:20px}
.racer{border:0;border-radius:28px;aspect-ratio:1;max-width:100%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(43,35,80,.25),inset 0 -8px 0 rgba(0,0,0,.12)}
.racer.on{outline:5px solid var(--ink);outline-offset:2px}
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 50% 30%,rgba(255,246,201,.92) 0,rgba(255,214,236,.9) 45%,rgba(185,230,255,.9) 100%);text-align:center}
#menu h1{margin:0;font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:.01em;text-wrap:balance;
  background:linear-gradient(90deg,#ff4f6d,#ff9f1c,#ffd23f,#3ecf6e,#3aa0ff,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(43,35,80,.25))}
#games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:min(560px,100%)}
.card{border:0;border-radius:32px;cursor:pointer;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;
  font-size:clamp(26px,7vw,38px);font-weight:700;box-shadow:0 8px 0 rgba(43,35,80,.25),inset 0 -10px 0 rgba(0,0,0,.1);
  animation:bob 1.8s ease-in-out infinite}
.card:nth-child(2){animation-delay:.3s}
.card .pic{font-size:clamp(64px,20vw,110px);line-height:1.1}
.card:active{transform:scale(.94)}
#cardRace{background:#ffcf4d}
#cardBlocks{background:#7fd7ff}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:clamp(72px,22vw,118px);aspect-ratio:3/2;margin:10px 0}
.mini i{border-radius:8px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.mini i.e{background:transparent!important;box-shadow:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
#bctl{position:fixed;z-index:6;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bctl .big{position:static;width:74px;height:74px;font-size:38px;border-radius:50%;padding:0;min-width:0}
#bctl .big:nth-child(1){background:#ffd6e0}#bctl .big:nth-child(2){background:#fff1b8}#bctl .big:nth-child(3){background:#d6ffe0}#bctl .big:nth-child(4){background:#d9ecff}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<canvas id="c"></canvas>
<div class="hud" id="stars" hidden>⭐ <span id="starN">0</span></div>
<div class="hud" id="place" hidden>🥇</div>
<div class="topright">
  <button class="hud round" id="home" hidden aria-label="Back to menu">🏠</button>
  <button class="hud round" id="mute" aria-label="Sound on or off">🔊</button>
</div>
<button class="big" id="carBtn" hidden aria-label="Change car">🐰</button>
<button class="big" id="viewBtn" hidden aria-label="Change view"><span>👀</span><span id="viewName">2D</span></button>
<div id="tray" hidden></div>
<div id="bctl" hidden>
  <button class="big" id="bLeft" aria-label="Move left">⬅️</button>
  <button class="big" id="bRot" aria-label="Turn">🔄</button>
  <button class="big" id="bRight" aria-label="Move right">➡️</button>
  <button class="big" id="bDown" aria-label="Drop">⬇️</button>
</div>
<div id="menu">
  <h1>Rainbow Racers</h1>
  <div id="games">
    <button class="card" id="cardRace"><span class="pic">🏎️</span>Race</button>
    <button class="card" id="cardBlocks"><span class="mini"><i style="background:#ff4f6d"></i><i style="background:#ff4f6d"></i><i class="e"></i><i style="background:#3ecf6e"></i><i style="background:#9b5de5"></i><i style="background:#ffd23f"></i></span>Blocks</button>
  </div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,roadHalf=150,carW=44,carH=70,playerY=500,decoSize=40,curveAmp=40;
const EC=new Map();
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  roadHalf=Math.min(W*0.3,250,H*0.45);
  carW=roadHalf*0.3;carH=carW*1.6;playerY=H*0.72;
  decoSize=Math.max(30,Math.min(72,Math.min(W,H)*0.095));
  curveAmp=Math.max(0,W/2-roadHalf-24)*0.85;
  EC.clear();
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixA=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mix=(a,b,t)=>rgb(mixA(a,b,t));
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));else ctx.rect(x,y,w,h);}
const store={get(k,d){try{const v=localStorage.getItem('rr_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('rr_'+k,JSON.stringify(v));}catch(e){}}};
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const qsize=s=>Math.pow(2,Math.round(Math.log2(Math.max(8,s))*4)/4);
function emoCanvas(ch,size){
  const q=qsize(size),k=ch+'|'+q;let c=EC.get(k);
  if(!c){if(EC.size>500)EC.clear();c=document.createElement('canvas');const s=Math.ceil(q*1.4);c.width=c.height=Math.ceil(s*DPR);
    const x=c.getContext('2d');x.scale(DPR,DPR);x.textAlign='center';x.textBaseline='middle';
    x.font=q+'px '+EMOJI_FONT;x.fillText(ch,s/2,s/2+q*0.06);c._s=s;c._q=q;EC.set(k,c);}
  return c;
}
function emoji(ch,x,y,size,alpha){if(size<3||size>900)return;const c=emoCanvas(ch,size);const s=c._s*size/c._q;
  if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.drawImage(c,x-s/2,y-s/2,s,s);if(alpha!==undefined)ctx.globalAlpha=1;}
function starPath(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rad=i%2?r*0.48:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
const RAINBOW=['#ff4f6d','#ff9f1c','#ffd23f','#3ecf6e','#3aa0ff','#9b5de5'];

// ---------- worlds ----------
const BIOMES=[
 {name:'Flower Meadow',icon:'🌼',g:'#86d96b',g2:'#74c85c',road:'#6e7291',c1:'#ff5d5d',c2:'#ffffff',s1:'#4fc0ff',s2:'#d2f3ff',hill:'#5fb85a',sky:'☀️',cloud:true,deco:['🌳','🌷','🌻','🌳','🍄','🌼','🐞','🐇'],wx:'butterfly'},
 {name:'Sunny Beach',icon:'🏖️',g:'#f7df98',g2:'#efcd78',road:'#8a86a3',c1:'#ff8a5b',c2:'#fff4d6',s1:'#3cb8ff',s2:'#c6f2ff',hill:'#2aa7d8',sky:'☀️',cloud:true,deco:['🌴','🐚','🦀','⛱️','🌴','🌺','🐢'],wx:'sparkle'},
 {name:'Under the Sea',icon:'🐠',g:'#49b6e0',g2:'#3ba5d0',road:'#2f6f9a',c1:'#ffd166',c2:'#ffffff',s1:'#0b4f82',s2:'#3aa6d9',hill:'#2a7fb0',sky:'🐳',cloud:false,deco:['🐠','🐙','🐡','🐳','🐬','🐚','🦀','🐟'],wx:'bubble'},
 {name:'Snowy Land',icon:'⛄',g:'#eef6ff',g2:'#d9e8fb',road:'#7d8bb3',c1:'#4fb3ff',c2:'#ffffff',s1:'#8fcaff',s2:'#eef7ff',hill:'#cfe2f7',sky:'☀️',cloud:true,deco:['🌲','⛄','🌲','🎄','🐧','❄️','🌲'],wx:'snow'},
 {name:'Candy Town',icon:'🍭',g:'#ffc6e3',g2:'#ffb1d7',road:'#b98ae0',c1:'#ff4fa0',c2:'#ffffff',s1:'#ff9fd2',s2:'#ffe6f3',hill:'#ff86c3',sky:'🌈',cloud:true,deco:['🍭','🍬','🧁','🍩','🍓','🍰','🍦'],wx:'heart'},
 {name:'Starry Space',icon:'🚀',g:'#2a2266',g2:'#372d80',road:'#4d43a0',c1:'#ffd84a',c2:'#7cf3ff',s1:'#05041a',s2:'#2a1f63',hill:'#1c1650',sky:'🪐',cloud:false,deco:['🪐','⭐','🌙','🚀','👽','🌟','🛸'],wx:'twinkle'},
];
BIOMES.forEach(b=>{b.G=hex(b.g);b.G2=hex(b.g2);b.R=hex(b.road);b.S1=hex(b.s1);b.S2=hex(b.s2);b.HL=hex(b.hill);});
const N=BIOMES.length;
const BL=()=>H*38, TR=()=>H*3;
const biomeIndex=d=>Math.floor(Math.max(0,d)/BL());
function blendAt(d){
  d=Math.max(0,d);const L=BL(),i=Math.floor(d/L),local=d-i*L,a=BIOMES[i%N],b=BIOMES[(i+1)%N];
  const t=local>L-TR()?(local-(L-TR()))/TR():0;return {a,b,t};
}
function decoBiome(d){const bi=biomeIndex(d),{t}=blendAt(d);return BIOMES[(t>0.5?bi+1:bi)%N];}
const fcurve=u=>0.6*Math.sin(u*1.25)+0.4*Math.sin(u*0.45+1);
const fslope=u=>0.75*Math.cos(u*1.25)+0.18*Math.cos(u*0.45+1);
function cx(d){return W/2+curveAmp*fcurve(d/H);}           // 2D road centre (screen px)
const A3=2.6;
function L3(d){return A3*roadHalf*fcurve(d/H);}              // 3D road centre (world px, sideways)

// ---------- racers ----------
const ROSTER=[
 {c:'#ff4d6d',e:'🐰'},{c:'#3aa0ff',e:'🐶'},{c:'#ffb700',e:'🐱'},{c:'#9b5de5',e:'🦄'},
 {c:'#2ec4b6',e:'🐸'},{c:'#ff8c42',e:'🦊'},{c:'#a47148',e:'🐻'},{c:'#f15bb5',e:'🐼'},
 {c:'#7bd389',e:'🐵'},{c:'#5c7cfa',e:'🐧'},{c:'#ff6b6b',e:'🦁'},{c:'#20c997',e:'🐲'}
];
const VIEWS=['2D','3D','Wheel'];

// ---------- audio ----------
let AC=null,master=null,muted=store.get('muted',false),nextNote=0,step=0,noiseBuf=null,melIdx=4;
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.8,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,t0,dur,type,vol,slide){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093];
const now=()=>AC?AC.currentTime:0;
function sfxStar(n){if(!AC)return;const t=now(),f=PENTA[Math.min(n,PENTA.length-1)];tone(f,t,0.28,'triangle',0.17);tone(f*2,t+0.03,0.22,'sine',0.06);}
function sfxBoing(){if(!AC)return;const t=now();tone(480,t,0.4,'triangle',0.2,120);tone(240,t+0.06,0.3,'sine',0.12,90);}
function sfxHonk(){if(!AC)return;const t=now();[0,0.2].forEach(o=>{tone(440,t+o,0.15,'square',0.06);tone(554,t+o,0.15,'square',0.05);});}
function sfxWhoosh(){if(!AC||!noiseBuf)return;const t=now(),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+0.6);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.75);tone(300,t,0.5,'sawtooth',0.04,1200);}
function sfxFanfare(){if(!AC)return;const t=now();[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.11,0.3,'square',0.06));tone(1046.5,t+0.44,0.7,'triangle',0.16);tone(1318.5,t+0.44,0.7,'sine',0.08);}
function sfxPass(){if(!AC)return;const t=now();tone(784,t,0.12,'triangle',0.1);tone(1046.5,t+0.09,0.2,'triangle',0.1);}
function sfxLand(){if(!AC)return;const t=now();PENTA.slice(0,8).forEach((f,i)=>tone(f,t+i*0.07,0.3,'triangle',0.1));}
function sfxTick(){if(!AC)return;tone(900,now(),0.06,'triangle',0.08);}
function sfxTurn(){if(!AC)return;tone(660,now(),0.1,'triangle',0.1,990);}
function sfxPlop(row){if(!AC)return;const t=now();tone(220+row*25,t,0.18,'sine',0.25,110);tone(440+row*50,t,0.08,'triangle',0.06);}
function sfxPop(){if(!AC)return;tone(500,now(),0.15,'sine',0.2,1400);}
const ROOTS=[130.81,196,220,174.61];
function music(tempo){
  if(!AC||muted)return;if(nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.25){
    const beat=step%16,bar=Math.floor(step/16)%4,r=ROOTS[bar];
    if(beat%4===0)tone(r,nextNote,0.35,'triangle',0.07);
    if(beat%4===2)tone(r*1.5,nextNote,0.2,'triangle',0.04);
    if(beat%2===0&&Math.random()<0.75){melIdx=clamp(melIdx+Math.floor(rnd(-2,3)),0,7);tone(PENTA[melIdx]/2,nextNote,0.22,'sine',0.045);}
    nextNote+=tempo;step++;
  }
}

// ---------- shared fx ----------
let parts=[],weather=[],banners=[];
let mode='menu';
function banner(text){banners.push({text,t:0,life:2.6});if(banners.length>2)banners.shift();}
function burst(x,y,n,colors){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(80,300);
  parts.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.4,0.8),t:0,size:rnd(4,9),color:colors[i%colors.length]});}}
function floatEmoji(ch,x,y,size){parts.push({type:'emoji',ch,x,y,vx:rnd(-30,30),vy:rnd(-140,-90),life:1.1,t:0,size:size||30});}
function confetti(){for(let i=0;i<90;i++)parts.push({type:'conf',x:rnd(0,W),y:rnd(-H*0.3,-10),vx:rnd(-40,40),vy:rnd(120,260),rot:rnd(0,6),vr:rnd(-8,8),life:3.2,t:0,size:rnd(7,13),color:RAINBOW[i%6]});}
function updateParts(dt,scroll){
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt+(p.world?scroll*dt:0);
    if(p.type==='spark'){p.vx*=0.92;p.vy*=0.92;}if(p.type==='conf')p.rot+=p.vr*dt;}
  parts=parts.filter(p=>p.t<p.life);
  for(const b of banners)b.t+=dt;banners=banners.filter(b=>b.t<b.life);
}
function drawParts(){
  for(const p of parts){const k=p.t/p.life;
    if(p.type==='spark'){ctx.fillStyle=p.color;ctx.globalAlpha=1-k;starPath(p.x,p.y,p.size*(1-k*0.5),p.t*5);ctx.fill();ctx.globalAlpha=1;}
    else if(p.type==='emoji')emoji(p.ch,p.x,p.y,p.size*(1+k*0.3),1-k*k);
    else if(p.type==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.globalAlpha=k>0.8?(1-k)*5:1;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();ctx.globalAlpha=1;}
    else if(p.type==='rain'){ctx.globalAlpha=(1-k)*0.8;ctx.fillStyle=`hsl(${p.hue},95%,62%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-k*0.6),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  }
}
function drawBanners(){
  const fs=Math.max(26,Math.min(54,W*0.075));
  banners.forEach((b,i)=>{const k=b.t/b.life,pop=k<0.15?k/0.15:1,sc=0.5+0.5*pop+(k<0.15?0.15*Math.sin(pop*Math.PI):0),a=k>0.8?(1-k)*5:1;
    const y=H*0.22+i*fs*1.5;ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,y);ctx.scale(sc,sc);

const S={running:false,d:0,base:300,boost:0,off:0,targetOff:0,tilt:0,stars:0,wobble:0,biome:0,place:1,lastWin:-99,t:0,

function spawnItems(){

      nextItemD+=n*carH*0.9;}
    else if(r<0.66)items.push({k:'star',d,off:rnd(-0.7,0.7)});
    else if(r<0.8)items.push({k:'boost',d,off:[-0.55,0,0.55][Math.floor(rnd(0,3))]});
    else if(r<0.88)items.push({k:'gift',d,off:rnd(-0.6,0.6),ch:['🎁','🎈','🍦','🧸','💎'][Math.floor(rnd(0,5))]});
    nextItemD+=rnd(0.35,0.6)*H;
  }
}
// where a point on the road shows up on screen in the current view
function onScreen(d,off,lift){
  if(view===0)return {x:cx(d)+off*roadHalf,y:playerY-(d-S.d)};
  const p=proj(d,L3(d)+off*roadHalf);if(!p)return {x:W/2,y:H*0.6};
  return {x:p.x,y:p.y-(lift||0.3)*roadHalf*p.s};
}

function updateRace(dt){
  S.t+=dt;S.base=Math.max(260,H*0.55);
  const sp=speedNow();S.sp=sp;S.d+=sp*dt;
  if(S.boost>0)S.boost=Math.max(0,S.boost-dt);
  if(S.honk>0)S.honk-=dt;
  const prev=S.off;
  if(view===2){
    if(!S.grab)S.wheel*=Math.exp(-3.5*dt);
    S.off=clamp(S.off+S.wheel*0.6*dt,-0.85,0.85);S.targetOff=S.off;
  }else{
    if(S.fingerX!==null)S.targetOff=view===0?clamp((S.fingerX-cx(S.d))/roadHalf,-0.8,0.8):clamp((S.fingerX-W/2)/(W*0.34),-0.8,0.8);
    S.off+=(S.targetOff-S.off)*Math.min(1,dt*9);S.off=clamp(S.off,-0.85,0.85);
  }
  S.tilt+=(((S.off-prev)/Math.max(dt,0.001))*0.18-S.tilt)*Math.min(1,dt*10);
  if(S.wobble>0)S.wobble=Math.max(0,S.wobble-dt);
  setupCam();

  const bi=biomeIndex(S.d);
  if(bi!==S.biome){S.biome=bi;const b=BIOMES[bi%N];banner(b.icon+' '+b.name+'! '+b.icon);sfxLand();confetti();}

  spawnItems();
  for(const it of items){
    if(it.got)continue;const dd=it.d-S.d,dx=(it.off-S.off)*roadHalf;
    if(it.k==='boost'){if(Math.abs(dd)<carH*0.75&&Math.abs(dx)<carW*1.05){it.got=true;S.boost=2.4;sfxWhoosh();const p=onScreen(S.d,S.off,1);floatEmoji('🌈',p.x,p.y-30,44);}}
    else if(Math.abs(dd)<carH*0.62&&Math.abs(dx)<carW*0.85){
      it.got=true;const p=onScreen(it.d,it.off,0.4);
      if(it.k==='star'){S.stars++;S.streak=(S.streakT>0?S.streak+1:0);S.streakT=1.2;sfxStar(S.streak);burst(p.x,p.y,10,['#ffd23f','#fff3a6','#ff9f1c']);
        if(S.stars%10===0){banner('⭐ '+S.stars+' stars! ⭐');sfxFanfare();confetti();}}
      else{S.stars+=3;sfxFanfare();burst(p.x,p.y,24,RAINBOW);floatEmoji(it.ch,p.x,p.y,52);floatEmoji('✨',p.x+20,p.y,30);}
      updateHud();
    }
  }
  if(S.streakT>0)S.streakT-=dt;
  items=items.filter(it=>it.d>S.d-H*0.4&&(!it.got||it.k==='boost'));

  for(const r of rivals){
    r.timer-=dt;if(r.timer<=0){r.vT=rnd(0.7,1.12);r.timer=rnd(2,5);r.offT=rnd(-0.7,0.7);}
    const ahead=r.d-S.d;
    if(ahead>H*2)r.vT=0.6;
    r.v+=(r.vT-r.v)*Math.min(1,dt*0.9);
    if(r.cool>0)r.cool-=dt;if(r.spin>0)r.spin=Math.max(0,r.spin-dt);
    r.d+=r.v*S.base*Math.min(1,0.35+S.t*0.5)*(r.spin>0?0.6:1)*dt;
    r.off+=(r.offT-r.off)*Math.min(1,dt*1.4);r.off=clamp(r.off,-0.85,0.85);
    if(ahead<-H*0.75){
      if(Math.random()<0.35){r.d=S.d-H*0.7;r.v=r.vT=1.3;r.timer=rnd(3,4.5);}
      else{r.d=S.d+H*rnd(1.1,2.0);r.v=r.vT=rnd(0.7,0.85);r.timer=rnd(2,4);}
      r.off=r.offT=rnd(-0.7,0.7);r.ahead=r.d>S.d;continue;
    }
    const dd=r.d-S.d,dx=(r.off-S.off)*roadHalf;
    if(Math.abs(dd)<carH*0.85&&Math.abs(dx)<carW*0.95&&r.cool<=0){
      const side=Math.sign(dx)||(Math.random()<0.5?-1:1);
      r.off=clamp(r.off+side*0.32,-0.85,0.85);r.offT=r.off;S.off=clamp(S.off-side*0.12,-0.85,0.85);
      S.wobble=0.5;r.spin=0.8;r.cool=0.9;sfxBoing();
      const p=onScreen(S.d+dd/2,(S.off+r.off)/2,0.8);floatEmoji(['💫','😆','🤪','✨'][Math.floor(rnd(0,4))],p.x,p.y-20,36);burst(p.x,p.y,8,['#fff','#ffd23f']);
    }
    const nowAhead=r.d>S.d;
    if(r.ahead&&!nowAhead&&Math.abs(dd)<H*0.6){S.passes++;sfxPass();const p=onScreen(r.d,r.off,1);floatEmoji(['👍','😄','🎉','💨'][S.passes%4],p.x,p.y-20,32);}
    r.ahead=nowAhead;
  }
  for(let i=0;i<rivals.length;i++)for(let j=i+1;j<rivals.length;j++){const a=rivals[i],b=rivals[j];
    if(Math.abs(a.d-b.d)<carH*1.1&&Math.abs(a.off-b.off)<0.32){const s=a.off<b.off?-1:1;a.off=clamp(a.off+s*dt*1.2,-0.85,0.85);b.off=clamp(b.off-s*dt*1.2,-0.85,0.85);a.offT=a.off;b.offT=b.off;}}
  const place=1+rivals.filter(r=>r.d>S.d).length;
  if(place!==S.place){S.place=place;updateHud();if(place===1&&S.t-S.lastWin>12){S.lastWin=S.t;banner('🏆 You are winning! 🏆');sfxFanfare();}}

  if(S.boost>0&&view===0){S.trail-=dt;if(S.trail<=0){S.trail=0.03;const x=cx(S.d)+S.off*roadHalf;
    parts.push({type:'rain',x:x+rnd(-4,4),y:playerY+carH*0.45,vx:0,vy:0,life:0.6,t:0,size:carW*0.35,hue:(S.t*400)%360,world:true});}}
  updateParts(dt,view===0?sp:0);
  updateWeather(dt,sp);
}
function updateWeather(dt,sp){
  const wb=BIOMES[S.biome%N].wx,par=view===0?1:0.25;
  const cap=wb==='butterfly'?7:wb==='heart'?10:22;
  if(weather.length<cap&&Math.random()<dt*8)spawnWeather(wb);
  for(const w of weather){w.t+=dt;w.y+=(w.vy+sp*w.par*par)*dt;w.x+=Math.sin(w.t*w.fq+w.ph)*w.sw*dt;}
  weather=weather.filter(w=>w.y<H+40&&w.y>-60&&w.t<14);
}
function spawnWeather(kind){
  const w={kind,x:rnd(0,W),y:-30,t:0,ph:rnd(0,6),fq:rnd(1,3),sw:rnd(20,60),vy:30,par:0.3,size:rnd(3,7)};
  if(kind==='butterfly'){w.vy=-20;w.par=0.6;w.sw=90;w.size=22;}
  else if(kind==='bubble'){w.y=H+20;w.vy=-160-S.base*0.6;w.par=0.6;w.size=rnd(5,12);}
  else if(kind==='snow'){w.vy=60;w.par=0.5;}
  else if(kind==='heart'){w.vy=10;w.par=0.6;w.size=rnd(16,24);}
  else if(kind==='twinkle'){w.vy=8;w.par=0.4;w.sw=0;}
  else {w.par=1;w.sw=0;}

function wheelGeo(){const R=Math.min(W*0.3,H*0.22);return {x:W/2,y:H-R*0.55,R};}
function raceDown(e){
  const x=e.clientX,y=e.clientY;S.touched=true;
  if(view===2){
    const g=wheelGeo(),dist=Math.hypot(x-g.x,y-g.y);
    if(dist<g.R*0.34&&S.honk<=0){sfxHonk();S.honk=0.5;for(let i=0;i<3;i++)floatEmoji(['💖','💛','💜'][i],g.x+rnd(-30,30),g.y-g.R*0.4,30);}
    if(dist<g.R*1.3)S.grab={m:'wheel',a:Math.atan2(y-g.y,x-g.x)};
    else{S.grab={m:'slide'};S.wheel=clamp((x-W/2)/(W*0.35),-1,1)*1.8;}
    return;
  }
  const px=view===0?cx(S.d)+S.off*roadHalf:S.px,py=view===0?playerY:S.py,hw=view===0?carW*0.8:S.pw*0.6;
  if(Math.abs(x-px)<hw&&Math.abs(y-py)<hw*1.2&&S.honk<=0){sfxHonk();S.honk=0.5;for(let i=0;i<3;i++)floatEmoji(['💖','💛','💜'][i],px+rnd(-20,20),py-hw,28);}
  S.fingerX=x;
}
function raceMove(e){
  if(view===2){if(!S.grab)return;const g=wheelGeo();
    if(S.grab.m==='wheel'){const a=Math.atan2(e.clientY-g.y,e.clientX-g.x);let da=a-S.grab.a;if(da>Math.PI)da-=Math.PI*2;if(da<-Math.PI)da+=Math.PI*2;
      S.wheel=clamp(S.wheel+da,-2.4,2.4);S.grab.a=a;}
    else S.wheel=clamp((e.clientX-W/2)/(W*0.35),-1,1)*1.8;
    return;}
  if(S.fingerX!==null)S.fingerX=e.clientX;
}
function raceUp(){S.fingerX=null;S.grab=null;}

const STRIP=6;

  const step=STRIP;
  for(let y=-step;y<H+step;y+=step){
    const d=S.d+(playerY-y),{a,b,t}=blendAt(d),c=cx(d);

    ctx.fillStyle=mix(band?a.G:a.G2,band?b.G:b.G2,t);ctx.fillRect(0,y,W,step+1);

      ctx.fillRect(c-roadHalf/3-lw/2,y,lw,step+1);ctx.fillRect(c+roadHalf/3-lw/2,y,lw,step+1);}
  }

  for(let i=Math.max(1,first);i<=last;i++){const dB=i*L,y=playerY-(dB-S.d);if(y<-roadHalf*1.5||y>H+60)continue;drawGate2D(cx(dB),y);}
  const sp=H*0.17,k0=Math.floor((S.d-(H-playerY)-80)/sp),k1=Math.ceil((S.d+playerY+80)/sp);

      emoji(ch,x,y,s);

function setupCam(){

  if(view===1){const back=rh*2.6;cam.F=targetHalf*back/rh;cam.hor=H*0.38;cam.h=(H*0.86-cam.hor)*back/cam.F;cam.d=S.d-back;cam.x=L3(S.d)+S.off*rh*0.75;cam.near=rh*0.6;}
  else{const back=rh*0.2;cam.hor=H*0.42;cam.F=Math.min(W,H*1.2)*0.75;cam.h=rh*0.42;cam.d=S.d-back;cam.x=L3(S.d)+S.off*rh;cam.near=rh*0.25;}
  cam.far=H*2.8;
}
function proj(d,xpx){const z=d-cam.d;if(z<cam.near*0.5)return null;const xr=xpx-cam.x-cam.slope*z;return {x:W/2+xr/z*cam.F,y:cam.hor+cam.h/z*cam.F,s:cam.F/z,z};}

const fog=z=>clamp((cam.far-z)/(cam.far*0.25),0,1);
const wrap=(v,m)=>((v%m)+m)%m;

  if(bm.name==='Under the Sea'){ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<5;i++){const x=wrap(i*W/4+hx*0.4+S.t*10,W*1.3)-W*0.15;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W*0.08,0);ctx.lineTo(x+W*0.2,cam.hor);ctx.lineTo(x+W*0.12,cam.hor);ctx.fill();}}
  const sunS=Math.min(W,H)*0.13;emoji(bm.sky,wrap(W*0.78+hx*0.35,W*1.4)-W*0.2,cam.hor*0.32,sunS);
  if(bm.cloud)for(let i=0;i<4;i++){const x=wrap(i*W*0.42+hx*0.6+S.t*8,W*1.6)-W*0.3;emoji('☁️',x,cam.hor*(0.2+0.17*(i%3)),sunS*(0.9+0.3*(i%2)));}
  const hc=mixA(a.HL,b.HL,t),pointy=bm.name==='Snowy Land';

    const dA=Math.max(k*seg,nearD),dB=(k+1)*seg;
    const pA=proj(dA,L3(dA)),pB=proj(dB,L3(dB));if(!pA||!pB)continue;

    quad(pA.x-wA*cbw,pA.x+wA*cbw,yA,pB.x-wB*cbw,pB.x+wB*cbw,yB,(k%2===0)?cb.c1:cb.c2);

    if(k%4<2){const lw=0.035;for(const o of[-1/3,1/3])quad(pA.x+(o-lw)*wA,pA.x+(o+lw)*wA,yA,pB.x+(o-lw)*wB,pB.x+(o+lw)*wB,yB,'rgba(255,255,255,.6)');}

        ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(p.x,p.y,s*0.32,s*0.08,0,0,Math.PI*2);ctx.fill();emoji(ch,p.x,p.y-s*0.42,s,fog(p.z));}});}}
  const L=BL();for(let i=Math.max(1,Math.ceil(nearD/L));i*L<=farD;i++){const dB=i*L;
    sprites.push({z:dB-cam.d,f:()=>{const p=proj(dB,L3(dB));if(!p)return;const R=rh*1.3*p.s,bw=rh*0.1*p.s;ctx.lineCap='round';ctx.globalAlpha=fog(p.z);
      RAINBOW.forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=bw;ctx.beginPath();ctx.arc(p.x,p.y,R-i*bw,Math.PI,Math.PI*2);ctx.stroke();});ctx.globalAlpha=1;}});}
  for(const it of items){if(it.got&&it.k!=='boost')continue;const z=it.d-cam.d;if(z<cam.near||z>cam.far)continue;
    sprites.push({z,f:()=>{

        for(let i=0;i<6;i++){const f0=-1+i/3,f1=f0+1/3+0.01;quad(p1.x+f0*w1,p1.x+f1*w1,p1.y,p2.x+f0*w2,p2.x+f1*w2,p2.y,RAINBOW[i]);}

  sprites.sort((a,b)=>b.z-a.z);for(const s of sprites)s.f();
  if(S.boost>0){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;for(let i=0;i<10;i++){const a=hash(i+Math.floor(S.t*24))*Math.PI*2,r1=Math.min(W,H)*0.3,r2=r1+Math.min(W,H)*0.25;
    ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r1,cam.hor+Math.sin(a)*r1*0.6);ctx.lineTo(W/2+Math.cos(a)*r2,cam.hor+Math.sin(a)*r2*0.6);ctx.stroke();}}
}

const B={cols:7,rows:11,grid:[],piece:null,t:0,fall:0.9,stars:0,flash:null,wipe:0,cell:40,ox:0,oy:0,drag:null,clouds:[],touched:false};
const SHAPES=[
 {c:[[0,0]],w:3},{c:[[0,0],[1,0]],w:4},{c:[[0,0],[1,0],[2,0]],w:3},{c:[[0,0],[0,1],[1,1]],w:4},
 {c:[[0,0],[1,0],[0,1],[1,1]],w:3},{c:[[0,0],[1,0],[2,0],[1,1]],w:2},{c:[[0,0],[0,1],[0,2],[1,2]],w:1},
 {c:[[0,0],[1,0],[2,0],[3,0]],w:1},{c:[[1,0],[2,0],[0,1],[1,1]],w:1}];
const BCOL=['#ff4f6d','#ff9f1c','#ffd23f','#3ecf6e','#3aa0ff','#9b5de5','#f15bb5','#2ec4b6'];
const FACES=['smile','happy','wink','o'];
const emptyGrid=()=>Array.from({length:B.rows},()=>Array(B.cols).fill(null));
function startBlocks(){
  Object.assign(B,{grid:emptyGrid(),piece:null,t:0,flash:null,wipe:0,stars:0,fall:0.9,touched:false,drag:null});
  parts=[];banners=[];B.clouds=Array.from({length:5},()=>({x:rnd(0,W),y:rnd(0.05,0.5),s:rnd(0.8,1.4),v:rnd(8,20)}));
  bSpawn();updateHud();banner('🧱 Block Party! 🧱');
}
function bSpawn(){
  const tot=SHAPES.reduce((a,s)=>a+s.w,0);let r=Math.random()*tot,sh=SHAPES[0];for(const s of SHAPES){r-=s.w;if(r<=0){sh=s;break;}}
  const cells=sh.c.map(a=>[a[0],a[1]]),w=Math.max(...cells.map(c=>c[0]))+1;
  B.piece={cells,x:Math.floor((B.cols-w)/2),y:0,color:BCOL[Math.floor(rnd(0,BCOL.length))],face:FACES[Math.floor(rnd(0,FACES.length))]};
  B.t=0;
  if(bHit(B.piece.cells,B.piece.x,B.piece.y))bFull();
}
function bFull(){B.piece=null;B.wipe=1.4;banner('Wheee! 🎉');sfxLand();confetti();}
function bHit(cells,x,y){for(const [a,b] of cells){const gx=x+a,gy=y+b;if(gx<0||gx>=B.cols||gy>=B.rows)return true;if(gy>=0&&B.grid[gy][gx])return true;}return false;}
function bMove(dx){const p=B.piece;if(!p||B.flash)return false;if(!bHit(p.cells,p.x+dx,p.y)){p.x+=dx;sfxTick();return true;}return false;}
function bRotate(){const p=B.piece;if(!p||B.flash)return;
  let r=p.cells.map(([x,y])=>[-y,x]);const mx=Math.min(...r.map(c=>c[0])),my=Math.min(...r.map(c=>c[1]));r=r.map(([x,y])=>[x-mx,y-my]);
  for(const k of[0,-1,1,-2,2])if(!bHit(r,p.x+k,p.y)){p.cells=r;p.x+=k;sfxTurn();return;}}
function bGhostY(){const p=B.piece;let y=p.y;while(!bHit(p.cells,p.x,y+1))y++;return y;}
function bDrop(){const p=B.piece;if(!p||B.flash)return;p.y=bGhostY();bLock();}
function bCellXY(x,y){return {x:B.ox+x*B.cell,y:B.oy+y*B.cell};}
function bLock(){
  const p=B.piece;let top=B.rows;
  for(const [a,b] of p.cells){const gx=p.x+a,gy=p.y+b;if(gy<0){bFull();return;}B.grid[gy][gx]={c:p.color,f:p.face};top=Math.min(top,gy);}
  sfxPlop(B.rows-top);
  const q=bCellXY(p.x+1,top+0.5);burst(q.x,q.y,6,[p.color,'#fff']);
  B.piece=null;
  const rows=[];for(let y=0;y<B.rows;y++)if(B.grid[y].every(Boolean))rows.push(y);
  if(rows.length){B.flash={rows,t:0};const t=now();PENTA.slice(0,5+rows.length).forEach((f,i)=>tone(f,t+i*0.06,0.25,'triangle',0.12));}
  else bSpawn();
}
function bLayout(){const top=78,bottom=112;B.cell=Math.floor(Math.min((W-32)/B.cols,(H-top-bottom)/B.rows));B.ox=(W-B.cell*B.cols)/2;B.oy=top+((H-top-bottom)-B.cell*B.rows)/2;}
function updateBlocks(dt){
  for(const c of B.clouds){c.x+=c.v*dt;if(c.x>W+80)c.x=-80;}
  if(B.wipe>0){B.wipe-=dt;if(B.wipe<=0){B.grid=emptyGrid();bSpawn();}}
  else if(B.flash){B.flash.t+=dt;if(B.flash.t>0.55){const rows=B.flash.rows;
      rows.forEach(y=>{for(let x=0;x<B.cols;x++){const p=bCellXY(x+0.5,y+0.5);burst(p.x,p.y,3,[B.grid[y][x].c,'#ffd23f']);}});
      for(const y of rows){B.grid.splice(y,1);B.grid.unshift(Array(B.cols).fill(null));}
      B.stars+=rows.length;updateHud();sfxPop();
      banner(['Yay! ⭐','Super! 🌟','Wow! ✨','Hooray! 🎉'][Math.floor(rnd(0,4))]+(rows.length>1?' x'+rows.length:''));
      if(rows.length>1||B.stars%5===0)confetti();
      B.fall=Math.max(0.6,0.9-B.stars*0.006);B.flash=null;bSpawn();}}
  else if(B.piece){B.t+=dt;if(B.t>=B.fall){B.t=0;if(!bHit(B.piece.cells,B.piece.x,B.piece.y+1))B.piece.y++;else bLock();}}
  updateParts(dt,0);
}
function drawBlock(x,y,s,color,face,alpha){
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  const p=s*0.06;ctx.fillStyle=color;rr(x+p,y+p,s-2*p,s-2*p,s*0.24);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.14)';rr(x+p,y+s*0.7,s-2*p,s*0.24,s*0.2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(x+s*0.18,y+s*0.14,s*0.4,s*0.13,s*0.07);ctx.fill();
  if(face){const ex=s*0.17,ey=y+s*0.47;ctx.fillStyle='#2b2350';ctx.strokeStyle='#2b2350';ctx.lineCap='round';ctx.lineWidth=s*0.05;
    if(face==='wink'){ctx.beginPath();ctx.arc(x+s/2-ex,ey,s*0.075,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x+s/2+ex-s*0.07,ey);ctx.lineTo(x+s/2+ex+s*0.07,ey);ctx.stroke();}
    else for(const sx of[-1,1]){ctx.beginPath();ctx.arc(x+s/2+sx*ex,ey,s*0.075,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#fff';for(const sx of[-1,1]){if(face==='wink'&&sx>0)continue;ctx.beginPath();ctx.arc(x+s/2+sx*ex+s*0.025,ey-s*0.025,s*0.025,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#2b2350';
    if(face==='o'){ctx.beginPath();ctx.arc(x+s/2,y+s*0.66,s*0.06,0,Math.PI*2);ctx.fill();}
    else if(face==='happy'){ctx.beginPath();ctx.arc(x+s/2,y+s*0.6,s*0.12,0,Math.PI);ctx.fill();}
    else{ctx.beginPath();ctx.arc(x+s/2,y+s*0.58,s*0.12,0.15*Math.PI,0.85*Math.PI);ctx.stroke();}
    ctx.fillStyle='rgba(255,120,150,.45)';for(const sx of[-1,1]){ctx.beginPath();ctx.ellipse(x+s/2+sx*s*0.3,y+s*0.62,s*0.07,s*0.045,0,0,Math.PI*2);ctx.fill();}
  }
  if(alpha!==undefined)ctx.globalAlpha=1;
}
function drawBlocks(){
  bLayout();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9fdcff');g.addColorStop(0.6,'#ffe1f0');g.addColorStop(1,'#fff3c4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const c of B.clouds)emoji('☁️',c.x,c.y*H,60*c.s,0.9);
  const {cell:s,ox,oy}=B,bw=s*B.cols,bh=s*B.rows;
  ctx.fillStyle='rgba(43,35,80,.12)';rr(ox-10,oy-4,bw+20,bh+20,26);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.88)';rr(ox-10,oy-10,bw+20,bh+20,26);ctx.fill();
  ctx.fillStyle='rgba(43,35,80,.08)';for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++){ctx.beginPath();ctx.arc(ox+(x+0.5)*s,oy+(y+0.5)*s,s*0.06,0,Math.PI*2);ctx.fill();}
  const wipeK=B.wipe>0?1.4-B.wipe:0;
  for(let y=0;y<B.rows;y++)for(let x=0;x<B.cols;x++){const c=B.grid[y][x];if(!c)continue;
    let bx=ox+x*s,by=oy+y*s;
    if(wipeK>0){by+=wipeK*wipeK*H*(0.6+hash(x*31+y)*0.8);bx+=(hash(x+y*7)-0.5)*wipeK*200;}
    if(B.flash&&B.flash.rows.includes(y)){const k=B.flash.t/0.55;drawBlock(bx,by,s,Math.floor(B.flash.t*12)%2?'#ffffff':RAINBOW[(x+Math.floor(B.flash.t*10))%6],c.f,1-k*0.5);}
    else drawBlock(bx,by,s,c.c,c.f);}
  const p=B.piece;
  if(p){const gy=bGhostY();ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.setLineDash([6,5]);
    for(const [a,b] of p.cells){if(gy+b<0)continue;rr(ox+(p.x+a)*s+s*0.1,oy+(gy+b)*s+s*0.1,s*0.8,s*0.8,s*0.2);ctx.stroke();}
    ctx.setLineDash([]);
    for(const [a,b] of p.cells){if(p.y+b<0)continue;drawBlock(ox+(p.x+a)*s,oy+(p.y+b)*s,s,p.color,p.face);}}
  drawParts();drawBanners();
  if(!B.touched)textPill('Tap or slide the blocks!',W/2,Math.min(H*0.5,oy+bh*0.55));
}
function blocksDown(e){
  B.touched=true;const p=B.piece;if(!p)return;
  B.drag={x0:e.clientX,y0:e.clientY,moved:false,col0:p.x,dropped:false};
}
function blocksMove(e){
  const d=B.drag;if(!d||!B.piece)return;
  const dx=e.clientX-d.x0,dy=e.clientY-d.y0;
  if(Math.abs(dx)>B.cell*0.4)d.moved=true;
  if(d.moved&&!d.dropped){const want=d.col0+Math.round(dx/B.cell);let guard=10;while(B.piece&&B.piece.x!==want&&guard--){if(!bMove(Math.sign(want-B.piece.x)))break;}}
  if(dy>B.cell*2.2&&!d.dropped&&Math.abs(dy)>Math.abs(dx)){d.dropped=true;d.moved=true;bDrop();}
}
function blocksUp(e){
  const d=B.drag;B.drag=null;if(!d||d.moved||!B.piece)return;
  const p=B.piece,wcells=Math.max(...p.cells.map(c=>c[0]))+1,mid=B.ox+(p.x+wcells/2)*B.cell,half=wcells*B.cell/2;
  if(e.clientX<mid-half)bMove(-1);else if(e.clientX>mid+half)bMove(1);else bRotate();
}

  mode=m;$('tray').hidden=true;

  weather=[];
  if(m==='race')startRace();
  if(m==='blocks')startBlocks();

}

$('cardBlocks').addEventListener('click',()=>{initAudio();sfxFanfare();setMode('blocks');});
$('home').addEventListener('click',()=>{sfxTick();setMode('menu');});
const muteBtn=$('mute');muteBtn.textContent=muted?'🔇':'🔊';
muteBtn.addEventListener('click',()=>{initAudio();muted=!muted;store.set('muted',muted);muteBtn.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:0.9;});

ROSTER.forEach((r,i)=>{const b=document.createElement('button');b.className='racer';b.style.background=r.c;b.textContent=r.e;b.setAttribute('aria-label','Drive '+r.e);

$('carBtn').addEventListener('click',()=>{sfxTick();tray.hidden=!tray.hidden;[...tray.children].forEach((b,i)=>b.classList.toggle('on',i===carIdx));});
function holdBtn(id,fn,repeat){let iv=null;const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();B.touched=true;fn();clearInterval(iv);if(repeat)iv=setInterval(fn,180);});
  const stop=()=>{clearInterval(iv);iv=null;};['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,stop));}
holdBtn('bLeft',()=>bMove(-1),true);holdBtn('bRight',()=>bMove(1),true);holdBtn('bRot',bRotate);holdBtn('bDown',bDrop);

cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(!tray.hidden){tray.hidden=true;return;}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(mode==='race')raceDown(e);else if(mode==='blocks')blocksDown(e);},{passive:false});
cv.addEventListener('pointermove',e=>{if(mode==='race')raceMove(e);else if(mode==='blocks')blocksMove(e);},{passive:false});
cv.addEventListener('pointerup',e=>{if(mode==='race')raceUp();else if(mode==='blocks')blocksUp(e);});
cv.addEventListener('pointercancel',()=>{raceUp();B.drag=null;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});

let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  if(mode==='race'){updateRace(dt);music(0.15);drawRace();}
  else if(mode==='blocks'){updateBlocks(dt);music(0.22);drawBlocks();}
  else{S.t+=dt;S.d+=H*0.3*dt;drawWorld2D();}
  requestAnimationFrame(frame);
}
setMode('menu');
requestAnimationFrame(frame);
})();
