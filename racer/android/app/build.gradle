plugins { id 'com.android.application' }
android {
    namespace 'com.rainbowracers.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rainbowracers.game'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// Wrap the shared game page into a full HTML file for the app.
tasks.register('copyGame') {
    def src = file('../../game.html'); def out = file('src/main/assets/index.html')
    inputs.file src; outputs.file out
    doLast {
        out.text = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>\n' + src.text + '\n</body></html>\n'
    }
}
preBuild.dependsOn copyGame
