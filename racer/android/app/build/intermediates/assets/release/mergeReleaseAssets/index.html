<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>
<title>Rainbow Racers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* One-screen arcade: full-bleed canvas, chunky rounded type, candy colors. Single bright look on purpose. */
:root{
  color-scheme:light;
  --ink:#2b2350;
  --cream:#fffaf0;
  --pink:#ff4fa0;
  --sun:#ffd23f;
  --sky:#5ec8ff;
  --font:"Fredoka","Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#86d96b;touch-action:none;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:var(--font);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;display:flex;align-items:center;gap:6px;font-weight:700;
  background:rgba(255,255,255,.88);border-radius:999px;padding:6px 14px;font-size:24px;
  box-shadow:0 4px 0 rgba(43,35,80,.18);pointer-events:none}
#stars{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
#place{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
#mute{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
  pointer-events:auto;border:0;cursor:pointer;font-family:inherit;width:46px;height:46px;justify-content:center;padding:0;font-size:22px}
#mute:focus-visible{outline:3px solid var(--pink)}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(circle at 50% 30%,#fff6c9 0,#ffd6ec 45%,#b9e6ff 100%);text-align:center}
#start h1{margin:0;font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:.01em;text-wrap:balance;
  background:linear-gradient(90deg,#ff4f6d,#ff9f1c,#ffd23f,#3ecf6e,#3aa0ff,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(43,35,80,.25))}
#start p{margin:0;font-size:clamp(20px,5vw,30px);font-weight:500}
#pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(420px,100%)}
@media (min-aspect-ratio:4/3){#pick{grid-template-columns:repeat(4,minmax(0,1fr));width:min(760px,100%)}}
.racer{border:0;border-radius:28px;aspect-ratio:1;max-width:100%;font-size:clamp(48px,14vw,80px);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(43,35,80,.25),inset 0 -10px 0 rgba(0,0,0,.12);
  animation:bob 1.6s ease-in-out infinite;font-family:inherit}
.racer:nth-child(2){animation-delay:.2s}.racer:nth-child(3){animation-delay:.4s}.racer:nth-child(4){animation-delay:.6s}
.racer:active{transform:scale(.92)}
.racer:focus-visible{outline:5px solid var(--ink)}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.racer{animation:none}}
</style>

<canvas id="c"></canvas>
<div class="hud" id="stars" hidden>⭐ <span id="starN">0</span></div>
<div class="hud" id="place" hidden>🥇</div>
<button class="hud" id="mute" hidden aria-label="Sound on or off">🔊</button>
<div id="start">
  <h1>Rainbow Racers</h1>
  <p>Pick your racer!</p>
  <div id="pick"></div>
</div>

<script>
(()=>{
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,roadHalf=150,carW=44,carH=70,playerY=500,decoSize=40,curveAmp=40;
const EC=new Map();
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  roadHalf=Math.min(W*0.3,250,H*0.45);
  carW=roadHalf*0.3;carH=carW*1.6;playerY=H*0.76;
  decoSize=Math.max(30,Math.min(72,Math.min(W,H)*0.095));
  curveAmp=Math.max(0,W/2-roadHalf-24)*0.85;
  EC.clear();
}
addEventListener('resize',resize);resize();

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>`rgb(${a[0]+(b[0]-a[0])*t|0},${a[1]+(b[1]-a[1])*t|0},${a[2]+(b[2]-a[2])*t|0})`;
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function emoCanvas(ch,size){
  size=Math.max(8,Math.round(size/4)*4);const k=ch+'|'+size;let c=EC.get(k);
  if(!c){c=document.createElement('canvas');const s=Math.ceil(size*1.4);c.width=c.height=Math.ceil(s*DPR);
    const x=c.getContext('2d');x.scale(DPR,DPR);x.textAlign='center';x.textBaseline='middle';
    x.font=size+'px '+EMOJI_FONT;x.fillText(ch,s/2,s/2+size*0.06);c._s=s;EC.set(k,c);}
  return c;
}
function emoji(ch,x,y,size,alpha){const c=emoCanvas(ch,size);const s=c._s*(size/(Math.max(8,Math.round(size/4)*4)));
  if(alpha!==undefined){ctx.globalAlpha=alpha;}ctx.drawImage(c,x-s/2,y-s/2,s,s);if(alpha!==undefined)ctx.globalAlpha=1;}

// ---------- worlds ----------
const BIOMES=[
 {name:'Flower Meadow',icon:'🌼',g:'#86d96b',g2:'#74c85c',road:'#6e7291',c1:'#ff5d5d',c2:'#ffffff',deco:['🌳','🌷','🌻','🌳','🍄','🌼','🐞','🐇'],wx:'butterfly'},
 {name:'Sunny Beach',icon:'🏖️',g:'#f7df98',g2:'#efcd78',road:'#8a86a3',c1:'#ff8a5b',c2:'#fff4d6',deco:['🌴','🐚','🦀','⛱️','🌴','🌺','🐢'],wx:'sparkle'},
 {name:'Under the Sea',icon:'🐠',g:'#49b6e0',g2:'#3ba5d0',road:'#2f6f9a',c1:'#ffd166',c2:'#ffffff',deco:['🐠','🐙','🐡','🐳','🐬','🐚','🦀','🐟'],wx:'bubble'},
 {name:'Snowy Land',icon:'⛄',g:'#eef6ff',g2:'#d9e8fb',road:'#7d8bb3',c1:'#4fb3ff',c2:'#ffffff',deco:['🌲','⛄','🌲','🎄','🐧','❄️','🌲'],wx:'snow'},
 {name:'Candy Town',icon:'🍭',g:'#ffc6e3',g2:'#ffb1d7',road:'#b98ae0',c1:'#ff4fa0',c2:'#ffffff',deco:['🍭','🍬','🧁','🍩','🍓','🍰','🍦'],wx:'heart'},
 {name:'Starry Space',icon:'🚀',g:'#2a2266',g2:'#372d80',road:'#4d43a0',c1:'#ffd84a',c2:'#7cf3ff',deco:['🪐','⭐','🌙','🚀','👽','🌟','🛸'],wx:'twinkle'},
];
BIOMES.forEach(b=>{b.G=hex(b.g);b.G2=hex(b.g2);b.R=hex(b.road);});
const N=BIOMES.length;
function BL(){return H*38;}      // world length of each land (~70s of driving)
function TR(){return H*3;}       // blend zone
function biomeIndex(d){return Math.floor(Math.max(0,d)/BL());}
function blendAt(d){
  d=Math.max(0,d);const L=BL(),i=Math.floor(d/L),local=d-i*L,a=BIOMES[i%N],b=BIOMES[(i+1)%N];
  const t=local>L-TR()?(local-(L-TR()))/TR():0;return {a,b,t};
}
function cx(d){const u=d/H;return W/2+curveAmp*(0.6*Math.sin(u*1.25)+0.4*Math.sin(u*0.45+1));}

// ---------- racers ----------
const ROSTER=[
 {c:'#ff4d6d',e:'🐰'},{c:'#3aa0ff',e:'🐶'},{c:'#ffb700',e:'🐱'},{c:'#9b5de5',e:'🦄'},
 {c:'#2ec4b6',e:'🐸'},{c:'#ff8c42',e:'🦊'},{c:'#a47148',e:'🐻'},{c:'#f15bb5',e:'🐼'},{c:'#7bd389',e:'🐵'}
];

// ---------- audio ----------
let AC=null,master=null,muted=false,nextNote=0,step=0,noiseBuf=null,melIdx=4;
function initAudio(){
  if(AC){if(AC.state!=='running')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.8,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,t0,dur,type,vol,slide){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093];
const now=()=>AC?AC.currentTime:0;
function sfxStar(n){if(!AC)return;const t=now(),f=PENTA[Math.min(n,PENTA.length-1)];tone(f,t,0.28,'triangle',0.17);tone(f*2,t+0.03,0.22,'sine',0.06);}
function sfxBoing(){if(!AC)return;const t=now();tone(480,t,0.4,'triangle',0.2,120);tone(240,t+0.06,0.3,'sine',0.12,90);}
function sfxHonk(){if(!AC)return;const t=now();[0,0.2].forEach(o=>{tone(440,t+o,0.15,'square',0.06);tone(554,t+o,0.15,'square',0.05);});}
function sfxWhoosh(){if(!AC||!noiseBuf)return;const t=now(),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+0.6);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+0.75);
  tone(300,t,0.5,'sawtooth',0.04,1200);}
function sfxFanfare(){if(!AC)return;const t=now();[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.11,0.3,'square',0.06));tone(1046.5,t+0.44,0.7,'triangle',0.16);tone(1318.5,t+0.44,0.7,'sine',0.08);}
function sfxPass(){if(!AC)return;const t=now();tone(784,t,0.12,'triangle',0.1);tone(1046.5,t+0.09,0.2,'triangle',0.1);}
function sfxLand(){if(!AC)return;const t=now();PENTA.slice(0,8).forEach((f,i)=>tone(f,t+i*0.07,0.3,'triangle',0.1));}
const ROOTS=[130.81,196,220,174.61];
function music(){
  if(!AC||muted)return;if(nextNote<AC.currentTime)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.25){
    const beat=step%16,bar=Math.floor(step/16)%4,r=ROOTS[bar];
    if(beat%4===0)tone(r,nextNote,0.35,'triangle',0.07);
    if(beat%4===2)tone(r*1.5,nextNote,0.2,'triangle',0.04);
    if(beat%2===0&&Math.random()<0.75){melIdx=clamp(melIdx+Math.floor(rnd(-2,3)),0,7);tone(PENTA[melIdx]/2*1,nextNote,0.22,'sine',0.045);}
    nextNote+=0.15;step++;
  }
}

// ---------- state ----------
const S={running:false,d:0,base:300,boost:0,off:0,targetOff:0,tilt:0,stars:0,wobble:0,biome:0,place:1,lastWin:-99,t:0,
  touched:false,fingerX:null,pc:'#ff4d6d',pe:'🐰',passes:0,trail:0,honk:0};
let rivals=[],items=[],parts=[],weather=[],banners=[],nextItemD=0;
const speedNow=()=>S.base*(1+0.8*Math.min(1,S.boost/0.4))*Math.min(1,0.35+S.t*0.5);

function start(pick){
  S.pc=pick.c;S.pe=pick.e;S.running=true;S.d=0;S.t=0;S.stars=0;S.off=0;S.targetOff=0;S.boost=0;S.biome=0;S.passes=0;
  const others=ROSTER.filter(r=>r!==pick).sort(()=>Math.random()-0.5).slice(0,4);
  rivals=others.map((o,i)=>({c:o.c,e:o.e,d:[0.25,0.55,-0.25,0.85][i]*H,off:[-0.5,0.45,0.5,-0.2][i],offT:0,v:0.85,vT:0.85,timer:rnd(1,3),spin:0,cool:0,ahead:true}));
  rivals.forEach(r=>{r.offT=r.off;r.ahead=r.d>S.d;});
  items=[];parts=[];banners=[];nextItemD=H*0.6;
  document.getElementById('start').hidden=true;
  ['stars','place','mute'].forEach(id=>document.getElementById(id).hidden=false);
  updateHud();
  banner('🏁 Go Go Go! 🏁');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
}

function banner(text){banners.push({text,t:0,life:2.6});if(banners.length>2)banners.shift();}
function burst(x,y,n,colors){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(80,300);
  parts.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.4,0.8),t:0,size:rnd(4,9),color:colors[i%colors.length]});}}
function floatEmoji(ch,x,y,size){parts.push({type:'emoji',ch,x,y,vx:rnd(-30,30),vy:rnd(-140,-90),life:1.1,t:0,size:size||30});}
function confetti(){const cols=['#ff4f6d','#ffd23f','#3ecf6e','#3aa0ff','#9b5de5','#ff9f1c'];
  for(let i=0;i<90;i++)parts.push({type:'conf',x:rnd(0,W),y:rnd(-H*0.3,-10),vx:rnd(-40,40),vy:rnd(120,260),rot:rnd(0,6),vr:rnd(-8,8),life:3.2,t:0,size:rnd(7,13),color:cols[i%cols.length]});}

function updateHud(){
  document.getElementById('starN').textContent=S.stars;
  const p=S.place;document.getElementById('place').textContent=p===1?'🥇 1st':p===2?'🥈 2nd':p===3?'🥉 3rd':(p+'th');
}

// ---------- spawning ----------
function spawnItems(){
  while(nextItemD<S.d+H*1.4){
    const r=Math.random(),d=nextItemD;
    if(r<0.5){const n=Math.floor(rnd(4,7)),o0=rnd(-0.6,0.6),amp=rnd(0.1,0.35),ph=rnd(0,6);
      for(let i=0;i<n;i++)items.push({k:'star',d:d+i*carH*0.9,off:clamp(o0+Math.sin(ph+i*0.7)*amp,-0.75,0.75)});
      nextItemD+=n*carH*0.9;}
    else if(r<0.66)items.push({k:'star',d,off:rnd(-0.7,0.7)});
    else if(r<0.8)items.push({k:'boost',d,off:[-0.55,0,0.55][Math.floor(rnd(0,3))]});
    else if(r<0.88)items.push({k:'gift',d,off:rnd(-0.6,0.6),ch:['🎁','🎈','🍦','🧸','💎'][Math.floor(rnd(0,5))]});
    nextItemD+=rnd(0.35,0.6)*H;
  }
}

// ---------- input ----------
function setFinger(x){S.fingerX=x;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(!S.running)return;
  const px=cx(S.d)+S.off*roadHalf;
  if(Math.abs(e.clientX-px)<carW*0.8&&Math.abs(e.clientY-playerY)<carH*0.7&&S.honk<=0){sfxHonk();S.honk=0.5;for(let i=0;i<3;i++)floatEmoji(['💖','💛','💜'][i],px+rnd(-20,20),playerY-carH*0.5,28);}
  setFinger(e.clientX);S.touched=true;try{cv.setPointerCapture(e.pointerId);}catch(_){} },{passive:false});
cv.addEventListener('pointermove',e=>{if(S.fingerX!==null)setFinger(e.clientX);},{passive:false});
const up=()=>{S.fingerX=null;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:0.9;});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});

const pick=document.getElementById('pick');
ROSTER.slice(0,4).forEach(r=>{const b=document.createElement('button');b.className='racer';b.style.background=r.c;b.textContent=r.e;
  b.setAttribute('aria-label','Race as '+r.e);b.addEventListener('click',()=>{initAudio();sfxFanfare();start(r);});pick.appendChild(b);});

// ---------- update ----------
function update(dt){
  S.t+=dt;
  const H2=H;S.base=Math.max(260,H2*0.55);
  const sp=speedNow();S.d+=sp*dt;
  if(S.boost>0)S.boost=Math.max(0,S.boost-dt);
  if(S.honk>0)S.honk-=dt;
  if(S.fingerX!==null)S.targetOff=clamp((S.fingerX-cx(S.d))/roadHalf,-0.8,0.8);
  const prev=S.off;S.off+=(S.targetOff-S.off)*Math.min(1,dt*9);S.off=clamp(S.off,-0.85,0.85);
  S.tilt+=(((S.off-prev)/Math.max(dt,0.001))*0.18-S.tilt)*Math.min(1,dt*10);
  if(S.wobble>0)S.wobble=Math.max(0,S.wobble-dt);

  // new land
  const bi=biomeIndex(S.d);
  if(bi!==S.biome){S.biome=bi;const b=BIOMES[bi%N];banner(b.icon+' '+b.name+'! '+b.icon);sfxLand();confetti();}

  spawnItems();
  // items
  for(const it of items){
    if(it.got)continue;const dd=it.d-S.d,dx=(it.off-S.off)*roadHalf;
    if(it.k==='boost'){if(Math.abs(dd)<carH*0.75&&Math.abs(dx)<carW*1.05){it.got=true;S.boost=2.4;sfxWhoosh();floatEmoji('🌈',cx(S.d)+S.off*roadHalf,playerY-carH,40);}}
    else if(Math.abs(dd)<carH*0.62&&Math.abs(dx)<carW*0.85){
      it.got=true;const x=cx(it.d)+it.off*roadHalf,y=playerY-dd;
      if(it.k==='star'){S.stars++;S.streak=(S.streakT>0?S.streak+1:0);S.streakT=1.2;sfxStar(S.streak);burst(x,y,10,['#ffd23f','#fff3a6','#ff9f1c']);
        if(S.stars%10===0){banner('⭐ '+S.stars+' stars! ⭐');sfxFanfare();confetti();}}
      else{S.stars+=3;sfxFanfare();burst(x,y,24,['#ff4f6d','#ffd23f','#3aa0ff','#9b5de5']);floatEmoji(it.ch,x,y,48);floatEmoji('✨',x+20,y,30);}
      updateHud();
    }
  }
  if(S.streakT>0)S.streakT-=dt;
  items=items.filter(it=>!it.got&&it.d>S.d-H*0.4||(it.k==='boost'&&it.d>S.d-H*0.4));

  // rivals
  for(const r of rivals){
    r.timer-=dt;if(r.timer<=0){r.vT=rnd(0.7,1.12);r.timer=rnd(2,5);r.offT=rnd(-0.7,0.7);}
    const ahead=r.d-S.d;
    if(ahead>H*1.3)r.vT=0.6;
    r.v+=(r.vT-r.v)*Math.min(1,dt*0.9);
    if(r.cool>0)r.cool-=dt;if(r.spin>0)r.spin=Math.max(0,r.spin-dt);
    r.d+=r.v*S.base*Math.min(1,0.35+S.t*0.5)*(r.spin>0?0.6:1)*dt;
    r.off+=(r.offT-r.off)*Math.min(1,dt*1.4);r.off=clamp(r.off,-0.85,0.85);
    if(ahead<-H*0.75){
      if(Math.random()<0.35){r.d=S.d-H*0.7;r.v=r.vT=1.3;r.timer=rnd(3,4.5);}
      else{r.d=S.d+H*rnd(0.95,1.5);r.v=r.vT=rnd(0.7,0.85);r.timer=rnd(2,4);}
      r.off=r.offT=rnd(-0.7,0.7);r.ahead=r.d>S.d;continue;
    }
    // bump
    const dd=r.d-S.d,dx=(r.off-S.off)*roadHalf;
    if(Math.abs(dd)<carH*0.85&&Math.abs(dx)<carW*0.95&&r.cool<=0){
      const side=Math.sign(dx)||(Math.random()<0.5?-1:1);
      r.off=clamp(r.off+side*0.32,-0.85,0.85);r.offT=r.off;S.off=clamp(S.off-side*0.12,-0.85,0.85);
      S.wobble=0.5;r.spin=0.8;r.cool=0.9;sfxBoing();
      const x=cx(S.d)+(S.off+r.off)/2*roadHalf,y=playerY-dd/2;floatEmoji(['💫','😆','🤪','✨'][Math.floor(rnd(0,4))],x,y-20,34);burst(x,y,8,['#fff','#ffd23f']);
    }
    // overtaking cheer
    const nowAhead=r.d>S.d;
    if(r.ahead&&!nowAhead&&Math.abs(dd)<H*0.6){S.passes++;sfxPass();floatEmoji(['👍','😄','🎉','💨'][S.passes%4],cx(r.d)+r.off*roadHalf,playerY-dd-20,30);}
    r.ahead=nowAhead;
  }
  // keep rivals apart
  for(let i=0;i<rivals.length;i++)for(let j=i+1;j<rivals.length;j++){const a=rivals[i],b=rivals[j];
    if(Math.abs(a.d-b.d)<carH*1.1&&Math.abs(a.off-b.off)<0.32){const s=a.off<b.off?-1:1;a.off=clamp(a.off+s*dt*1.2,-0.85,0.85);b.off=clamp(b.off-s*dt*1.2,-0.85,0.85);a.offT=a.off;b.offT=b.off;}}
  const place=1+rivals.filter(r=>r.d>S.d).length;
  if(place!==S.place){S.place=place;updateHud();if(place===1&&S.t-S.lastWin>12){S.lastWin=S.t;banner('🏆 You are winning! 🏆');sfxFanfare();}}

  // boost trail
  if(S.boost>0){S.trail-=dt;if(S.trail<=0){S.trail=0.03;const x=cx(S.d)+S.off*roadHalf;
    parts.push({type:'rain',x:x+rnd(-4,4),y:playerY+carH*0.45,vx:0,vy:0,life:0.6,t:0,size:carW*0.35,hue:(S.t*400)%360,world:true});}}

  // particles
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt+(p.world?sp*dt:0);
    if(p.type==='spark'){p.vx*=0.92;p.vy*=0.92;}if(p.type==='conf')p.rot+=p.vr*dt;}
  parts=parts.filter(p=>p.t<p.life);
  // weather
  const wb=BIOMES[S.biome%N].wx;
  const cap=wb==="butterfly"?7:wb==="heart"?10:22;if(weather.length<cap&&Math.random()<dt*8)spawnWeather(wb);
  for(const w of weather){w.t+=dt;w.y+=(w.vy+sp*w.par)*dt;w.x+=Math.sin(w.t*w.fq+w.ph)*w.sw*dt;}
  weather=weather.filter(w=>w.y<H+40&&w.y>-60&&w.t<14);
  for(const b of banners)b.t+=dt;banners=banners.filter(b=>b.t<b.life);
}
function spawnWeather(kind){
  const w={kind,x:rnd(0,W),y:-30,t:0,ph:rnd(0,6),fq:rnd(1,3),sw:rnd(20,60),vy:0,par:0.3,size:rnd(3,7)};
  if(kind==='butterfly'){w.vy=-20;w.par=0.6;w.sw=90;w.size=22;}
  else if(kind==='bubble'){w.y=H+20;w.vy=-160-S.base*0.6;w.par=0.6;w.size=rnd(5,12);}
  else if(kind==='snow'){w.vy=60;w.par=0.5;}
  else if(kind==='heart'){w.vy=10;w.par=0.6;w.size=rnd(16,24);}
  else if(kind==='twinkle'){w.vy=0;w.par=0.4;w.sw=0;}
  else {w.par=1;w.sw=0;}
  weather.push(w);
}

// ---------- draw ----------
const STRIP=6;
function drawWorld(){
  const step=STRIP;
  for(let y=-step;y<H+step;y+=step){
    const d=S.d+(playerY-y),{a,b,t}=blendAt(d),c=cx(d);
    const band=Math.floor(d/(H*0.06))%2===0;
    ctx.fillStyle=mix(band?a.G:a.G2,band?b.G:b.G2,t);ctx.fillRect(0,y,W,step+1);
    ctx.fillStyle=mix(a.R,b.R,t);ctx.fillRect(c-roadHalf,y,roadHalf*2,step+1);
    const cb=t<0.5?a:b,curb=Math.floor(d/36)%2===0?cb.c1:cb.c2,cw=Math.max(10,roadHalf*0.07);
    ctx.fillStyle=curb;ctx.fillRect(c-roadHalf-cw,y,cw,step+1);ctx.fillRect(c+roadHalf,y,cw,step+1);
    if(Math.floor(d/48)%2===0){ctx.fillStyle='rgba(255,255,255,.55)';const lw=Math.max(4,roadHalf*0.025);
      ctx.fillRect(c-roadHalf/3-lw/2,y,lw,step+1);ctx.fillRect(c+roadHalf/3-lw/2,y,lw,step+1);}
  }
  // rainbow gates between lands
  const L=BL(),first=Math.floor((S.d-playerY*0.3)/L),last=Math.floor((S.d+playerY+H*0.2)/L);
  for(let i=Math.max(1,first);i<=last;i++){const dB=i*L,y=playerY-(dB-S.d);if(y<-roadHalf*1.5||y>H+60)continue;drawGate(cx(dB),y);}
  // decorations
  const sp=H*0.17,k0=Math.floor((S.d-(H-playerY)-80)/sp),k1=Math.ceil((S.d+playerY+80)/sp);
  for(let k=k0;k<=k1;k++){
    const d=k*sp,y=playerY-(d-S.d),bi=biomeIndex(d),{t}=blendAt(d),bm=BIOMES[(t>0.5?bi+1:bi)%N];
    for(let side=-1;side<=1;side+=2){
      const h=hash(k*2+(side>0?1:0));if(h<0.25)continue;
      const room=W/2-roadHalf+curveAmp,gap=roadHalf+Math.max(10,roadHalf*0.07)+decoSize*0.6;
      const x=cx(d)+side*(gap+hash(k*7+side*3)*Math.max(8,room-decoSize*0.4));
      if(x<-decoSize||x>W+decoSize)continue;
      const ch=bm.deco[Math.floor(hash(k*13+side)*bm.deco.length)],s=decoSize*(0.8+hash(k*5+side)*0.5);
      ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(x,y+s*0.38,s*0.34,s*0.12,0,0,Math.PI*2);ctx.fill();
      emoji(ch,x,y,s);
    }
  }
}
function drawGate(x,y){
  const cols=['#ff4f6d','#ff9f1c','#ffd23f','#3ecf6e','#3aa0ff','#9b5de5'],R=roadHalf*1.25,bw=roadHalf*0.07;
  ctx.lineCap='round';
  cols.forEach((c,i)=>{ctx.strokeStyle=c;ctx.lineWidth=bw;ctx.beginPath();ctx.arc(x,y,R-i*bw,Math.PI,Math.PI*2);ctx.stroke();});
  ctx.fillStyle='rgba(255,255,255,.85)';const r=bw*0.6;
  for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(x+i*roadHalf*0.35,y+r,r,0,Math.PI*2);ctx.fill();}
}
function starPath(x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rad=i%2?r*0.48:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
function drawItems(){
  for(const it of items){
    const y=playerY-(it.d-S.d);if(y<-80||y>H+80)continue;const x=cx(it.d)+it.off*roadHalf;
    if(it.k==='star'){const r=carW*0.42*(1+0.08*Math.sin(S.t*6+it.d)),rot=Math.sin(S.t*3+it.d*0.01)*0.3;
      ctx.fillStyle='rgba(255,240,150,.35)';ctx.beginPath();ctx.arc(x,y,r*1.5,0,Math.PI*2);ctx.fill();
      starPath(x,y,r,rot);ctx.fillStyle='#ffd23f';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#f39c12';ctx.lineJoin='round';ctx.stroke();
      ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(x-r*0.22,y-r*0.2,r*0.13,0,Math.PI*2);ctx.fill();}
    else if(it.k==='boost'){const w=carW*1.5,h=carH*0.95,cols=['#ff4f6d','#ff9f1c','#ffd23f','#3ecf6e','#3aa0ff','#9b5de5'];
      ctx.save();rr(x-w/2,y-h/2,w,h,w*0.2);ctx.clip();cols.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(x-w/2+i*w/6,y-h/2,w/6+1,h);});ctx.restore();
      ctx.fillStyle='rgba(255,255,255,.95)';const pulse=(S.t*2)%1;
      for(let j=0;j<2;j++){const yy=y+h*0.2-j*h*0.38-pulse*h*0.1;ctx.beginPath();ctx.moveTo(x-w*0.3,yy+h*0.12);ctx.lineTo(x,yy-h*0.12);ctx.lineTo(x+w*0.3,yy+h*0.12);ctx.lineTo(x+w*0.3,yy+h*0.24);ctx.lineTo(x,yy);ctx.lineTo(x-w*0.3,yy+h*0.24);ctx.closePath();ctx.fill();}}
    else{const b=Math.sin(S.t*4+it.d)*6;ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(x,y+b,carW*0.62,0,Math.PI*2);ctx.fill();emoji(it.ch,x,y+b,carW*0.95);}
  }
}
function drawCar(x,y,col,emo,ang,boost){
  const w=carW,h=carH;ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,h*0.1,w*0.62,h*0.52,0,0,Math.PI*2);ctx.fill();
  if(boost){ctx.fillStyle='rgba(255,210,63,.9)';ctx.beginPath();ctx.moveTo(-w*0.25,h*0.5);ctx.lineTo(0,h*(0.85+Math.random()*0.25));ctx.lineTo(w*0.25,h*0.5);ctx.fill();}
  ctx.fillStyle='#2b2b3a';
  for(const sx of[-1,1])for(const sy of[-1,1]){rr(sx*w*0.5-w*0.13,sy*h*0.3-h*0.11,w*0.26,h*0.22,w*0.08);ctx.fill();}
  ctx.fillStyle=col;rr(-w/2,-h/2,w,h,w*0.38);ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(0,0,0,.18)';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';rr(-w*0.1,-h*0.47,w*0.2,h*0.94,w*0.1);ctx.fill();
  ctx.fillStyle='#c9efff';rr(-w*0.36,-h*0.32,w*0.72,h*0.18,w*0.12);ctx.fill();
  ctx.fillStyle='#fff6a8';for(const sx of[-1,1]){ctx.beginPath();ctx.arc(sx*w*0.27,-h*0.43,w*0.09,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='rgba(0,0,0,.22)';rr(-w*0.52,h*0.38,w*1.04,h*0.1,4);ctx.fill();
  emoji(emo,0,h*0.08,w*0.7);
  ctx.restore();
}
function drawRacers(){
  const list=rivals.map(r=>({y:playerY-(r.d-S.d),r})).filter(o=>o.y>-carH&&o.y<H+carH);
  list.push({y:playerY,me:true});list.sort((a,b)=>a.y-b.y);
  for(const o of list){
    if(o.me){const x=cx(S.d)+S.off*roadHalf,wob=S.wobble>0?Math.sin(S.wobble*40)*0.25*S.wobble:0;
      const ang=clamp(S.tilt,-0.45,0.45)+wob+(cx(S.d+30)-cx(S.d))*0.004;
      if(S.boost>0){ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(x,playerY,carW*1.1,0,Math.PI*2);ctx.fill();}
      drawCar(x,playerY,S.pc,S.pe,ang,S.boost>0);
      ctx.fillStyle='#fff';ctx.strokeStyle=S.pc;ctx.lineWidth=3;starPath(x,playerY-carH*0.78,carW*0.18,S.t*2);ctx.fill();ctx.stroke();}
    else{const r=o.r,x=cx(r.d)+r.off*roadHalf,ang=r.spin>0?(0.8-r.spin)*Math.PI*2.5:(r.offT-r.off)*0.5;drawCar(x,o.y,r.c,r.e,ang,r.v>1.1);}
  }
}
function drawParts(){
  for(const p of parts){const k=p.t/p.life;
    if(p.type==='spark'){ctx.fillStyle=p.color;ctx.globalAlpha=1-k;starPath(p.x,p.y,p.size*(1-k*0.5),p.t*5);ctx.fill();ctx.globalAlpha=1;}
    else if(p.type==='emoji')emoji(p.ch,p.x,p.y,p.size*(1+k*0.3),1-k*k);
    else if(p.type==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.globalAlpha=k>0.8?(1-k)*5:1;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();ctx.globalAlpha=1;}
    else if(p.type==='rain'){ctx.globalAlpha=(1-k)*0.8;ctx.fillStyle=`hsl(${p.hue},95%,62%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-k*0.6),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  }
}
function drawWeather(){
  for(const w of weather){
    if(w.kind==='butterfly')emoji('🦋',w.x,w.y,w.size);
    else if(w.kind==='heart')emoji('💗',w.x,w.y,w.size,0.85);
    else if(w.kind==='bubble'){ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y,w.size,0,Math.PI*2);ctx.stroke();}
    else if(w.kind==='snow'){ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(w.x,w.y,w.size,0,Math.PI*2);ctx.fill();}
    else if(w.kind==='twinkle'){ctx.fillStyle=`rgba(255,240,170,${0.5+0.5*Math.sin(w.t*6+w.ph)})`;starPath(w.x,w.y,w.size*1.4,0);ctx.fill();}
    else{ctx.fillStyle=`rgba(255,255,255,${0.4+0.4*Math.sin(w.t*8+w.ph)})`;starPath(w.x,w.y,w.size,0.3);ctx.fill();}
  }
  if(S.boost>0){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;for(let i=0;i<6;i++){const x=hash(i+Math.floor(S.t*20))*W,y=hash(i*3+Math.floor(S.t*20))*H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+60);ctx.stroke();}}
}
function drawBanners(){
  const fs=Math.max(26,Math.min(54,W*0.075));
  banners.forEach((b,i)=>{const k=b.t/b.life,pop=k<0.15?k/0.15:1,sc=0.5+0.5*pop+(k<0.15?0.15*Math.sin(pop*Math.PI):0),a=k>0.8?(1-k)*5:1;
    const y=H*0.24+i*fs*1.5;ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,y);ctx.scale(sc,sc);
    ctx.font=`700 ${fs}px Fredoka,"Baloo 2","Trebuchet MS",sans-serif, ${EMOJI_FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=Math.min(ctx.measureText(b.text).width,W*0.92);ctx.fillStyle='rgba(255,255,255,.92)';rr(-tw/2-20,-fs*0.75,tw+40,fs*1.5,fs*0.75);ctx.fill();
    ctx.fillStyle='#2b2350';ctx.fillText(b.text,0,2,W*0.88);ctx.restore();});
}
function drawHint(){
  if(S.touched||!S.running)return;const x=cx(S.d)+S.off*roadHalf+Math.sin(S.t*3)*roadHalf*0.45,y=playerY+carH*0.55;
  emoji('👆',x,y+20,54);
  const fs=26;ctx.font=`700 ${fs}px Fredoka,"Trebuchet MS",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const t='Slide your finger!',tw=ctx.measureText(t).width;ctx.fillStyle='rgba(255,255,255,.92)';rr(W/2-tw/2-16,playerY-carH*1.6-fs*0.7,tw+32,fs*1.4,fs*0.7);ctx.fill();
  ctx.fillStyle='#2b2350';ctx.fillText(t,W/2,playerY-carH*1.6);
}

// ---------- loop ----------
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  if(S.running){update(dt);music();}
  else{S.t+=dt;S.d+=H*0.3*dt;}   // gentle idle scroll behind the menu
  drawWorld();drawItems();if(S.running)drawRacers();drawParts();drawWeather();drawBanners();drawHint();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
